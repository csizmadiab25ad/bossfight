<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER-ARENA: BALANCED SHIELD & EVOLVING BOSS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #030305;
            color: #fff;
            font-family: 'Consolas', 'Courier New', monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 60px rgba(255, 0, 85, 0.3);
            border: 2px solid #1a1a2e;
            border-radius: 10px;
            overflow: hidden;
        }

        canvas {
            display: block;
            background: #05050a;
            cursor: crosshair;
        }

        /* MENÜ OVERLAY */
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 12, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            gap: 20px;
        }

        h1.title {
            font-size: 42px;
            letter-spacing: 4px;
            color: #ff0055;
            text-shadow: 0 0 20px #ff0055, 0 0 40px #7000ff;
            margin-bottom: 10px;
        }

        .menu-btn {
            width: 250px;
            padding: 15px 0;
            font-family: inherit;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background: #0f0f1d;
            border: 2px solid #ff0055;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s all;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.2);
        }

        .menu-btn:hover {
            background: #ff0055;
            color: #000;
            box-shadow: 0 0 25px #ff0055;
            transform: scale(1.05);
        }

        /* IN-GAME HUD */
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 5;
        }

        .stats-panel {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 250px;
        }

        .bar-wrap {
            position: relative;
            width: 100%;
            height: 16px;
            background: rgba(15, 15, 25, 0.8);
            border: 1px solid #333;
            border-radius: 4px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.05s linear;
        }

        .bar-text {
            position: absolute;
            top: 0;
            left: 5px;
            font-size: 11px;
            line-height: 16px;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 2px #000;
        }

        #player-hp { background: linear-gradient(90deg, #ff3366, #ff6699); }
        #player-energy { background: linear-gradient(90deg, #00f0ff, #7000ff); }

        #boss-panel {
            width: 350px;
            text-align: right;
        }

        #boss-hp { background: linear-gradient(90deg, #ff0000, #990000); }

        /* TUTORIAL INSTRUCTION BOX */
        #tutorial-instructions {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 15, 30, 0.9);
            border: 2px solid #ff0055;
            border-radius: 8px;
            padding: 12px 25px;
            text-align: center;
            z-index: 6;
            pointer-events: none;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
        }

        #tutorial-instructions h3 {
            color: #ff0055;
            font-size: 16px;
            margin-bottom: 5px;
        }

        #tutorial-instructions p {
            font-size: 13px;
            color: #ddd;
        }

        .cooldown-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            background: rgba(10, 10, 20, 0.85);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #ff005544;
            z-index: 5;
        }

        .cd-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            color: #888;
        }

        .cd-key {
            font-size: 14px;
            font-weight: bold;
            color: #ff0055;
            margin-bottom: 2px;
        }

        #exit-tut-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 7;
            padding: 8px 15px;
            background: #ff3366;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            display: none;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="canvas" width="1000" height="700"></canvas>

        <button id="exit-tut-btn" onclick="exitToMenu()">KILÉPÉS A MENÜBE</button>

        <!-- MAIN MENU -->
        <div id="main-menu" class="overlay-screen">
            <h1 class="title">CYBER ARENA</h1>
            <button class="menu-btn" onclick="startGame(false)">PLAY GAME</button>
            <button class="menu-btn" style="border-color: #7000ff;" onclick="startGame(true)">TRAINING</button>
        </div>

        <!-- TUTORIAL INSTRUCTIONS -->
        <div id="tutorial-instructions" style="display: none;">
            <h3>GYAKORLÓ MÓD</h3>
            <p id="tut-text">Használd a gombokat a gyakorláshoz a lefagyasztott bot ellen!</p>
        </div>

        <!-- GAME HUD -->
        <div id="ui-overlay" style="display: none;">
            <div class="stats-panel">
                <div class="bar-wrap">
                    <div id="player-hp" class="bar-fill"></div>
                    <span class="bar-text">HP</span>
                </div>
                <div class="bar-wrap">
                    <div id="player-energy" class="bar-fill"></div>
                    <span class="bar-text">ENERGY (PAJZS IS EZT HASZNÁLJA)</span>
                </div>
            </div>

            <div id="boss-panel">
                <div style="font-weight: bold; color: #ff3366; margin-bottom: 4px;" id="boss-title">NEXUS GUARDIAN</div>
                <div class="bar-wrap">
                    <div id="boss-hp" class="bar-fill"></div>
                    <span class="bar-text" id="boss-bar-label">BOSS HP</span>
                </div>
            </div>
        </div>

        <div class="cooldown-container" id="cd-hud" style="display: none;">
            <div class="cd-box"><span class="cd-key">L-CLICK</span><span>PLASMA SHOT</span></div>
            <div class="cd-box"><span class="cd-key">Q</span><span>KARD TÁMADÁS</span></div>
            <div class="cd-box"><span class="cd-key">F</span><span>HEAL (HP)</span></div>
            <div class="cd-box"><span class="cd-key">R-CLICK / E</span><span>PAJZS (ENERGY DRAIN)</span></div>
            <div class="cd-box"><span class="cd-key">SPACE / SHIFT</span><span>DASH</span></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const WIDTH = canvas.width;
        const HEIGHT = canvas.height;
        let screenShake = 0;
        let inGame = false;
        let isTutorialMode = false;

        const keys = {};
        const mouse = { x: 0, y: 0, down: false };

        // PLAYER OBJECT
        const player = {
            x: WIDTH / 2,
            y: HEIGHT / 2 + 150,
            radius: 18,
            speed: 5.2,
            hp: 100, maxHp: 100,
            energy: 100, maxEnergy: 100,
            isShielding: false,
            isDashing: false,
            dashCooldown: 0,
            attackCooldown: 0,
            shootCooldown: 0,
            healCooldown: 0,
            angle: 0,
            kills: 0,
            slashAnim: 0 
        };

        // EVOLVING BOSS OBJECT
        const boss = {
            x: WIDTH / 2,
            y: HEIGHT / 2 - 120,
            radius: 20,
            hp: 150, maxHp: 150,
            level: 0,
            vx: 0, vy: 0,
            angle: 0,
            state: 'IDLE',
            stateTimer: 0,
            isAlive: true,
            respawnTimer: 0,
            attackFlash: 0,
            mainColor: '#cc0022',
            eyeColor: '#ff0000',
            glowColor: '#ff0033'
        };

        let particles = [];
        let projectiles = [];
        let floatingTexts = [];
        let shockwaves = [];
        let minions = [];

        function startGame(tutorial = false) {
            isTutorialMode = tutorial;
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('ui-overlay').style.display = 'flex';
            document.getElementById('cd-hud').style.display = 'flex';

            if (isTutorialMode) {
                document.getElementById('tutorial-instructions').style.display = 'block';
                document.getElementById('exit-tut-btn').style.display = 'block';
                document.getElementById('boss-title').innerText = "TRAINING DUMMY (BOT)";
                document.getElementById('boss-title').style.color = "#ff3366";
                document.getElementById('tut-text').innerHTML = "WASD: Mozgás | BAL KATT: Lövés | Q: Kard | F: Heal | SPACE: Dash | E/JOBB KATT: Pajzs";
            } else {
                document.getElementById('tutorial-instructions').style.display = 'none';
                document.getElementById('exit-tut-btn').style.display = 'none';
                updateBossTitle();
            }

            inGame = true;
            resetGame();
        }

        function updateBossTitle() {
            document.getElementById('boss-title').innerText = `NEXUS GUARDIAN (LVL ${boss.level})`;
            document.getElementById('boss-title').style.color = boss.glowColor;
        }

        function exitToMenu() {
            inGame = false;
            document.getElementById('main-menu').style.display = 'flex';
            document.getElementById('ui-overlay').style.display = 'none';
            document.getElementById('cd-hud').style.display = 'none';
            document.getElementById('tutorial-instructions').style.display = 'none';
            document.getElementById('exit-tut-btn').style.display = 'none';
        }

        function resetGame() {
            player.hp = player.maxHp;
            player.energy = player.maxEnergy;
            player.x = WIDTH / 2;
            player.y = HEIGHT / 2 + 150;
            player.kills = 0;
            boss.level = 0;
            minions = [];
            respawnBoss();
        }

        window.addEventListener('blur', () => {
            for (let k in keys) keys[k] = false;
            mouse.down = false;
            player.isShielding = false;
        });

        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'KeyE') player.isShielding = true;
            if (e.code === 'Space' || e.code === 'ShiftLeft') triggerDash();
            if (e.code === 'KeyQ') attack();
            if (e.code === 'KeyF') triggerHeal();
        });

        window.addEventListener('keyup', e => {
            keys[e.code] = false;
            if (e.code === 'KeyE') player.isShielding = false;
        });

        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });

        canvas.addEventListener('mousedown', e => {
            if (e.button === 0) mouse.down = true;
            if (e.button === 2) player.isShielding = true;
        });

        canvas.addEventListener('mouseup', e => {
            if (e.button === 0) mouse.down = false;
            if (e.button === 2) player.isShielding = false;
        });

        canvas.addEventListener('contextmenu', e => e.preventDefault());

        function createParticles(x, y, color, count, speed = 4) {
            for (let i = 0; i < count; i++) {
                const ang = Math.random() * Math.PI * 2;
                const spd = Math.random() * speed + 1;
                particles.push({
                    x, y,
                    vx: Math.cos(ang) * spd,
                    vy: Math.sin(ang) * spd,
                    color, life: 1,
                    decay: Math.random() * 0.04 + 0.02,
                    size: Math.random() * 4 + 2
                });
            }
        }

        function spawnShockwave(x, y, maxRadius, color, speed = 3) {
            shockwaves.push({ x, y, radius: 5, maxRadius, color, speed, alpha: 1 });
        }

        function spawnFloatingText(x, y, text, color = '#fff') {
            floatingTexts.push({ x, y, text, color, alpha: 1, vy: -1.5 });
        }

        function triggerScreenShake(intensity) {
            screenShake = intensity;
        }

        function triggerHeal() {
            if (!inGame || player.healCooldown > 0 || player.energy < 35 || player.hp >= player.maxHp) return;

            player.energy -= 35;
            player.hp = Math.min(player.maxHp, player.hp + 30);
            player.healCooldown = 25;

            createParticles(player.x, player.y, '#00ff66', 35, 6);
            createParticles(player.x, player.y, '#ffffff', 15, 3);
            spawnShockwave(player.x, player.y, 75, '#00ff66', 4);
            spawnFloatingText(player.x, player.y, "+30 HP", "#00ff66");
        }

        // LÖVÉS - PAJZS HASZNÁLAT KÖZBEN NEM LEHETSÉGES!
        function triggerShoot() {
            if (!inGame || player.shootCooldown > 0 || player.energy < 8 || player.isShielding) return;

            player.energy -= 8;
            player.shootCooldown = 12;

            const angle = player.angle;
            const muzzleX = player.x + Math.cos(angle) * 26;
            const muzzleY = player.y + Math.sin(angle) * 26;

            createParticles(muzzleX, muzzleY, '#00f0ff', 16, 6);
            createParticles(muzzleX, muzzleY, '#ffffff', 8, 3);
            spawnShockwave(muzzleX, muzzleY, 30, '#00f0ff', 5);
            triggerScreenShake(3);

            projectiles.push({
                x: muzzleX,
                y: muzzleY,
                vx: Math.cos(angle) * 16,
                vy: Math.sin(angle) * 16,
                radius: 8,
                color: '#00f0ff',
                isPlayerBullet: true
            });
        }

        function triggerDash() {
            if (!inGame || player.dashCooldown > 0 || player.energy < 25) return;

            player.energy -= 25;
            player.dashCooldown = 30;
            player.isDashing = true;

            const dashAngle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
            const dashDist = 180;

            spawnShockwave(player.x, player.y, 40, '#7000ff', 5);

            for (let i = 0; i < 12; i++) {
                const tx = player.x + Math.cos(dashAngle) * (dashDist * (i / 12));
                const ty = player.y + Math.sin(dashAngle) * (dashDist * (i / 12));
                createParticles(tx, ty, '#7000ff', 4, 3);
            }

            player.x += Math.cos(dashAngle) * dashDist;
            player.y += Math.sin(dashAngle) * dashDist;

            player.x = Math.max(30, Math.min(WIDTH - 30, player.x));
            player.y = Math.max(30, Math.min(HEIGHT - 30, player.y));

            spawnShockwave(player.x, player.y, 50, '#00f0ff', 5);
            triggerScreenShake(7);

            if (boss.isAlive && Math.hypot(boss.x - player.x, boss.y - player.y) < boss.radius + 40) {
                damageBoss(35, true);
                spawnFloatingText(boss.x, boss.y, "DASH CUT!", "#7000ff");
            }

            setTimeout(() => player.isDashing = false, 150);
        }

        function attack() {
            if (player.attackCooldown > 0) return;
            player.attackCooldown = 12;

            player.slashAnim = 1.0;

            const attackAngle = player.angle;
            const hitX = player.x + Math.cos(attackAngle) * 55;
            const hitY = player.y + Math.sin(attackAngle) * 55;

            createParticles(hitX, hitY, '#00f0ff', 18, 6);
            createParticles(hitX, hitY, '#ffffff', 10, 3);
            spawnShockwave(hitX, hitY, 50, '#00f0ff', 5);

            if (boss.isAlive && Math.hypot(boss.x - hitX, boss.y - hitY) < boss.radius + 35) {
                let dmg = 24;
                let isCrit = Math.random() < 0.35;
                if (isCrit) dmg *= 1.8;

                damageBoss(Math.floor(dmg), isCrit);
                triggerScreenShake(5);

                if (!isTutorialMode) {
                    boss.vx += Math.cos(attackAngle) * 4;
                    boss.vy += Math.sin(attackAngle) * 4;
                }
            }

            minions.forEach((m, idx) => {
                if (Math.hypot(m.x - hitX, m.y - hitY) < m.radius + 30) {
                    m.hp -= 35;
                    createParticles(m.x, m.y, '#ff0055', 10, 4);
                    if (m.hp <= 0) minions.splice(idx, 1);
                }
            });
        }

        function damageBoss(amount, isCrit = false) {
            boss.hp -= amount;
            spawnFloatingText(boss.x, boss.y, amount, isCrit ? '#ffcc00' : '#ff3366');
            createParticles(boss.x, boss.y, boss.glowColor, 15, 6);
            spawnShockwave(boss.x, boss.y, 50, boss.glowColor, 4);

            if (boss.hp <= 0) {
                boss.isAlive = false;
                boss.respawnTimer = isTutorialMode ? 60 : 180;
                player.kills++;
                createParticles(boss.x, boss.y, boss.glowColor, 120, 12);
                spawnShockwave(boss.x, boss.y, 140, boss.glowColor, 6);
                triggerScreenShake(20);
                spawnFloatingText(boss.x, boss.y, isTutorialMode ? "BOT REBOOTING" : "BOSS DESTROYED!", "#00ffcc");
            }
        }

        function respawnBoss() {
            if (!isTutorialMode) boss.level++;

            if (isTutorialMode) {
                boss.radius = 25;
                boss.maxHp = 200;
                boss.mainColor = '#2a0006';
                boss.eyeColor = '#ff0000';
                boss.glowColor = '#ff0033';
            } else {
                boss.radius = Math.min(22 + boss.level * 5, 55);
                boss.maxHp = 140 + (boss.level - 1) * 150;

                if (boss.level >= 5) {
                    boss.mainColor = '#1a002a';
                    boss.eyeColor = '#ffff00';
                    boss.glowColor = '#ff00ff';
                } else if (boss.level >= 3) {
                    boss.mainColor = '#3a0008';
                    boss.eyeColor = '#ff3300';
                    boss.glowColor = '#ff0055';
                } else {
                    boss.mainColor = '#220004';
                    boss.eyeColor = '#ff0000';
                    boss.glowColor = '#ff0033';
                }
            }

            boss.hp = boss.maxHp;
            boss.x = WIDTH / 2;
            boss.y = HEIGHT / 2 - 120;
            boss.isAlive = true;
            boss.state = 'IDLE';

            if (!isTutorialMode) updateBossTitle();
        }

        function updateBossAI() {
            if (!boss.isAlive) {
                boss.respawnTimer--;
                if (boss.respawnTimer <= 0) respawnBoss();
                return;
            }

            boss.angle = Math.atan2(player.y - boss.y, player.x - boss.x);

            if (Math.random() < 0.5) {
                const ang = Math.random() * Math.PI * 2;
                const dist = Math.random() * boss.radius;
                particles.push({
                    x: boss.x + Math.cos(ang) * dist,
                    y: boss.y + Math.sin(ang) * dist,
                    vx: (Math.random() - 0.5) * 1.5,
                    vy: -Math.random() * 2 - 0.5,
                    color: boss.glowColor, life: 0.8, decay: 0.03, size: Math.random() * 3 + 2
                });
            }

            if (isTutorialMode) return;

            boss.x += boss.vx; boss.y += boss.vy;
            boss.vx *= 0.85; boss.vy *= 0.85;

            boss.x = Math.max(50, Math.min(WIDTH - 50, boss.x));
            boss.y = Math.max(50, Math.min(HEIGHT - 50, boss.y));

            boss.stateTimer++;

            if (boss.state === 'IDLE') {
                boss.x += Math.cos(boss.angle) * (2 + boss.level * 0.3);
                boss.y += Math.sin(boss.angle) * (2 + boss.level * 0.3);

                if (boss.stateTimer > Math.max(40, 70 - boss.level * 5)) {
                    boss.stateTimer = 0;
                    let actions = ['BULLET_HELL', 'TELEPORT_ATTACK'];
                    if (boss.level >= 2) actions.push('SPAWN_MINIONS');

                    boss.state = actions[Math.floor(Math.random() * actions.length)];
                    boss.attackFlash = 25;
                    spawnShockwave(boss.x, boss.y, 60, '#ffff00', 5);
                }
            } 
            else if (boss.state === 'BULLET_HELL') {
                if (boss.stateTimer % Math.max(6, 10 - boss.level) === 0) {
                    const count = 8 + Math.min(boss.level * 2, 10);
                    for (let i = 0; i < count; i++) {
                        const ang = (Math.PI * 2 / count) * i + (boss.stateTimer * 0.1);
                        projectiles.push({
                            x: boss.x, y: boss.y,
                            vx: Math.cos(ang) * (4.5 + boss.level * 0.2),
                            vy: Math.sin(ang) * (4.5 + boss.level * 0.2),
                            radius: 6, color: boss.glowColor,
                            isPlayerBullet: false
                        });
                    }
                    spawnShockwave(boss.x, boss.y, 40, boss.glowColor, 4);
                }
                if (boss.stateTimer > 60) { boss.state = 'IDLE'; boss.stateTimer = 0; }
            } 
            else if (boss.state === 'TELEPORT_ATTACK') {
                if (boss.stateTimer === 15) {
                    createParticles(boss.x, boss.y, boss.glowColor, 30, 6);
                    spawnShockwave(boss.x, boss.y, 50, boss.glowColor, 5);
                    boss.x = player.x - Math.cos(player.angle) * 90;
                    boss.y = player.y - Math.sin(player.angle) * 90;
                    createParticles(boss.x, boss.y, boss.glowColor, 30, 6);
                    spawnShockwave(boss.x, boss.y, 60, boss.glowColor, 6);
                    
                    if (Math.hypot(player.x - boss.x, player.y - boss.y) < boss.radius + 40) {
                        damagePlayer(20 + boss.level * 2);
                    }
                }
                if (boss.stateTimer > 35) { boss.state = 'IDLE'; boss.stateTimer = 0; }
            }
            else if (boss.state === 'SPAWN_MINIONS') {
                if (boss.stateTimer === 15) {
                    spawnShockwave(boss.x, boss.y, 80, boss.glowColor, 6);
                    let spawnCount = Math.min(1 + Math.floor(boss.level / 2), 4);
                    for (let i = 0; i < spawnCount; i++) {
                        let ang = (Math.PI * 2 / spawnCount) * i;
                        minions.push({
                            x: boss.x + Math.cos(ang) * 50,
                            y: boss.y + Math.sin(ang) * 50,
                            radius: 12,
                            hp: 25,
                            angle: 0
                        });
                    }
                    spawnFloatingText(boss.x, boss.y, "MINIONS SPAWNED!", boss.glowColor);
                }
                if (boss.stateTimer > 30) { boss.state = 'IDLE'; boss.stateTimer = 0; }
            }
        }

        // SEBZŐDÉS ÉS PAJZS ENERGIA FOGYÁS
        function damagePlayer(amount) {
            if (player.isDashing) return;

            // HA A PAJZS BE VAN KAPCSOLVA ÉS VAN ENERGIA -> LEVONJA AZ ENERGIÁT ÉS BLOKKOL
            if (player.isShielding && player.energy > 0) {
                player.energy = Math.max(0, player.energy - 20); // MELEE/TELEPORT BLOKK 20 ENERGIÁT FOGYASZT
                createParticles(player.x, player.y, '#00ffcc', 15, 6);
                spawnShockwave(player.x, player.y, 45, '#00ffcc', 5);
                spawnFloatingText(player.x, player.y, "BLOCK! (-20 EN)", "#00ffcc");
                return;
            }

            player.hp -= amount;
            triggerScreenShake(10);
            createParticles(player.x, player.y, '#ff0000', 15, 6);
            spawnShockwave(player.x, player.y, 40, '#ff0000', 4);

            if (player.hp <= 0) {
                alert(`MEGHALTÁL! Legyőzött Bossok: ${player.kills}`);
                location.reload();
            }
        }

        function update() {
            if (!inGame) return;

            let dx = 0, dy = 0;
            if (keys['KeyW']) dy -= 1;
            if (keys['KeyS']) dy += 1;
            if (keys['KeyA']) dx -= 1;
            if (keys['KeyD']) dx += 1;

            if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }

            if (dx !== 0 || dy !== 0) {
                if (Math.random() < 0.5) {
                    particles.push({
                        x: player.x, y: player.y,
                        vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2,
                        color: '#00f0ff', life: 0.5, decay: 0.05, size: 3
                    });
                }
            }

            let speed = player.isShielding ? player.speed * 0.4 : player.speed;
            player.x = Math.max(30, Math.min(WIDTH - 30, player.x + dx * speed));
            player.y = Math.max(30, Math.min(HEIGHT - 30, player.y + dy * speed));

            player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

            if (player.attackCooldown > 0) player.attackCooldown--;
            if (player.shootCooldown > 0) player.shootCooldown--;
            if (player.dashCooldown > 0) player.dashCooldown--;
            if (player.healCooldown > 0) player.healCooldown--;
            if (player.slashAnim > 0) player.slashAnim -= 0.1;

            // Csak akkor regenerálódik energia ha NEM használja a pajzsot
            if (player.energy < player.maxEnergy && !player.isShielding) {
                player.energy += 0.5;
            }

            // Ha 0 az energia, a pajzs kikapcsol
            if (player.energy <= 0) {
                player.isShielding = false;
            }

            // BAL KLIKK LÖVÉS (Ha nem pajzsik)
            if (mouse.down && !player.isShielding) triggerShoot();

            updateBossAI();

            minions.forEach((m, i) => {
                let mAng = Math.atan2(player.y - m.y, player.x - m.x);
                m.x += Math.cos(mAng) * 2.5;
                m.y += Math.sin(mAng) * 2.5;

                if (Math.hypot(player.x - m.x, player.y - m.y) < player.radius + m.radius) {
                    damagePlayer(10);
                    createParticles(m.x, m.y, '#ff0055', 10, 4);
                    minions.splice(i, 1);
                }
            });

            // Lövedék logika
            projectiles.forEach((p, index) => {
                p.x += p.vx; p.y += p.vy;

                if (Math.random() < 0.5) {
                    particles.push({
                        x: p.x, y: p.y,
                        vx: (Math.random() - 0.5), vy: (Math.random() - 0.5),
                        color: p.color, life: 0.5, decay: 0.05, size: 3
                    });
                }

                if (p.isPlayerBullet) {
                    if (boss.isAlive && Math.hypot(boss.x - p.x, boss.y - p.y) < boss.radius + p.radius) {
                        damageBoss(25, false);
                        createParticles(p.x, p.y, '#00f0ff', 12, 5);
                        spawnShockwave(p.x, p.y, 30, '#00f0ff', 4);
                        projectiles.splice(index, 1);
                        return;
                    }

                    minions.forEach((m, mIdx) => {
                        if (Math.hypot(m.x - p.x, m.y - p.y) < m.radius + p.radius) {
                            m.hp -= 25;
                            createParticles(p.x, p.y, '#00f0ff', 8, 4);
                            projectiles.splice(index, 1);
                            if (m.hp <= 0) minions.splice(mIdx, 1);
                        }
                    });
                }

                if (!p.isPlayerBullet) {
                    if (Math.hypot(player.x - p.x, player.y - p.y) < player.radius + p.radius) {
                        // PAJZS BLOKK / VISSZAVERÉS ENERGIA FOGYASZTÁSSAL
                        if (player.isShielding && player.energy >= 12) {
                            player.energy -= 12; // Lövedék blokkolása 12 energiát fogyaszt
                            p.vx *= -1.5; p.vy *= -1.5;
                            p.color = '#00ffcc';
                            p.isPlayerBullet = true;
                            createParticles(p.x, p.y, '#00ffcc', 12, 5);
                            spawnShockwave(p.x, p.y, 35, '#00ffcc', 4);
                            spawnFloatingText(player.x, player.y, "-12 EN", "#00ffcc");
                        } else {
                            damagePlayer(12 + boss.level);
                            createParticles(p.x, p.y, '#ff0055', 8, 4);
                            projectiles.splice(index, 1);
                        }
                    }
                }

                if (p.x < 0 || p.x > WIDTH || p.y < 0 || p.y > HEIGHT) projectiles.splice(index, 1);
            });

            shockwaves.forEach((sw, i) => {
                sw.radius += sw.speed;
                sw.alpha -= 0.04;
                if (sw.alpha <= 0 || sw.radius >= sw.maxRadius) shockwaves.splice(i, 1);
            });

            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy; p.life -= p.decay;
                if (p.life <= 0) particles.splice(i, 1);
            });

            floatingTexts.forEach((t, i) => {
                t.y += t.vy; t.alpha -= 0.02;
                if (t.alpha <= 0) floatingTexts.splice(i, 1);
            });

            // HUD
            document.getElementById('player-hp').style.width = `${(player.hp / player.maxHp) * 100}%`;
            document.getElementById('player-energy').style.width = `${(player.energy / player.maxEnergy) * 100}%`;
            document.getElementById('boss-hp').style.width = `${Math.max(0, (boss.hp / boss.maxHp) * 100)}%`;
        }

        function draw() {
            ctx.save();

            if (screenShake > 0) {
                ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
                screenShake *= 0.9;
                if (screenShake < 0.5) screenShake = 0;
            }

            ctx.fillStyle = '#05050a';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            ctx.strokeStyle = '#101020';
            ctx.lineWidth = 1;
            for (let x = 0; x < WIDTH; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, HEIGHT); ctx.stroke(); }
            for (let y = 0; y < HEIGHT; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WIDTH, y); ctx.stroke(); }

            if (inGame) {
                shockwaves.forEach(sw => {
                    ctx.save();
                    ctx.globalAlpha = Math.max(0, sw.alpha);
                    ctx.strokeStyle = sw.color;
                    ctx.shadowColor = sw.color;
                    ctx.shadowBlur = 15;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                });

                if (boss.isAlive) {
                    ctx.save();
                    ctx.translate(boss.x, boss.y);
                    ctx.rotate(boss.angle);
                    
                    ctx.shadowColor = boss.glowColor; ctx.shadowBlur = 25;
                    ctx.fillStyle = boss.mainColor;
                    ctx.beginPath(); ctx.arc(0, 0, boss.radius, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = boss.glowColor; ctx.lineWidth = 4; ctx.stroke();

                    ctx.fillStyle = boss.eyeColor;
                    ctx.shadowColor = boss.eyeColor;
                    ctx.shadowBlur = 12;
                    
                    let eyeOffset = boss.radius * 0.4;
                    ctx.beginPath();
                    ctx.moveTo(eyeOffset, -eyeOffset);
                    ctx.lineTo(eyeOffset + 10, -eyeOffset + 4);
                    ctx.lineTo(eyeOffset, -eyeOffset + 8);
                    ctx.closePath();
                    ctx.fill();

                    ctx.beginPath();
                    ctx.moveTo(eyeOffset, eyeOffset);
                    ctx.lineTo(eyeOffset + 10, eyeOffset - 4);
                    ctx.lineTo(eyeOffset, eyeOffset - 8);
                    ctx.closePath();
                    ctx.fill();

                    if (boss.attackFlash > 0) {
                        boss.attackFlash--;
                        ctx.strokeStyle = '#ffff00';
                        ctx.shadowColor = '#ffff00';
                        ctx.shadowBlur = 30;
                        ctx.lineWidth = 4;
                        ctx.beginPath();
                        ctx.arc(0, 0, boss.radius + 15, 0, Math.PI * 2);
                        ctx.stroke();

                        ctx.fillStyle = '#ffff00';
                        ctx.font = 'bold 26px Consolas';
                        ctx.fillText('!', -6, -boss.radius - 15);
                    }

                    ctx.restore();
                }

                minions.forEach(m => {
                    ctx.save();
                    ctx.translate(m.x, m.y);
                    ctx.fillStyle = '#ff0055';
                    ctx.shadowColor = '#ff0055';
                    ctx.shadowBlur = 12;
                    ctx.beginPath(); ctx.arc(0, 0, m.radius, 0, Math.PI * 2); ctx.fill();
                    ctx.restore();
                });

                projectiles.forEach(p => {
                    ctx.save();
                    ctx.fillStyle = p.color;
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 15;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
                    ctx.restore();
                });

                ctx.save();
                ctx.translate(player.x, player.y);
                ctx.rotate(player.angle);

                // Pajzs csak akkor látható, ha aktív és van energia
                if (player.isShielding && player.energy > 0) {
                    ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 4;
                    ctx.shadowColor = '#00ffcc'; ctx.shadowBlur = 20;
                    ctx.beginPath(); ctx.arc(0, 0, player.radius + 14, -Math.PI / 2, Math.PI / 2); ctx.stroke();
                }

                if (player.slashAnim > 0) {
                    ctx.save();
                    ctx.strokeStyle = '#00f0ff';
                    ctx.shadowColor = '#00f0ff';
                    ctx.shadowBlur = 25;
                    ctx.lineWidth = 7;
                    ctx.globalAlpha = player.slashAnim;

                    ctx.beginPath();
                    ctx.arc(10, 0, 55, -Math.PI / 3, Math.PI / 3);
                    ctx.stroke();

                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(10, 0, 48, -Math.PI / 3.5, Math.PI / 3.5);
                    ctx.stroke();

                    ctx.restore();
                }

                ctx.fillStyle = '#00f0ff';
                ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 15;
                ctx.beginPath(); ctx.arc(0, 0, player.radius, 0, Math.PI * 2); ctx.fill();
                
                ctx.fillStyle = '#fff'; ctx.fillRect(10, -3, 16, 6);
                ctx.restore();
            }

            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 8;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            });

            floatingTexts.forEach(t => {
                ctx.save();
                ctx.globalAlpha = t.alpha;
                ctx.fillStyle = t.color;
                ctx.shadowColor = t.color;
                ctx.shadowBlur = 10;
                ctx.font = 'bold 16px Consolas';
                ctx.fillText(t.text, t.x, t.y);
                ctx.restore();
            });

            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
